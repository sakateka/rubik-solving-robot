[package]
name = "rubik-scan"
version = "0.1.0"
edition = "2021"
description = "Rubik's cube face scanner: YOLO-based sticker color detection"

[features]
# Compiles the small C adapter for CVI Runtime. Enable only for the Milk-V
# cross-build: it links against libcviruntime/libcvikernel from the SDK image.
cvi-runtime = []
# Compiles the VI/ISP camera probe against the CVI media stack.  It implies
# cvi-runtime because both features are only meaningful in the Duo cross-build.
cvi-camera = ["cvi-runtime"]
pca9685 = ["dep:i2cdev"]

[[bin]]
name = "rubik-camera-probe"
path = "src/bin/rubik-camera-probe.rs"
required-features = ["cvi-camera"]

[[bin]]
name = "rubik-servo-probe"
path = "src/bin/rubik-servo-probe.rs"
required-features = ["pca9685"]

[[bin]]
name = "rubik-servo-init"
path = "src/bin/rubik-servo-init.rs"
required-features = ["pca9685"]

[[bin]]
name = "rubik-servo-calibrate"
path = "src/bin/rubik-servo-calibrate.rs"
required-features = ["pca9685"]

[[bin]]
name = "rubik-stand"
path = "src/bin/rubik-stand.rs"
required-features = ["pca9685"]

[[bin]]
name = "rubik-stand-runtime"
path = "src/bin/rubik-stand-runtime.rs"
required-features = ["pca9685"]

[[bin]]
name = "rubik-move-probe"
path = "src/bin/rubik-move-probe.rs"
required-features = ["pca9685"]

[[bin]]
name = "rubik-full-scan"
path = "src/bin/rubik-full-scan.rs"
required-features = ["pca9685", "cvi-camera"]

[dependencies]
anyhow = "1"
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
humantime = "2"
min2phase = { git = "https://github.com/cs0x7f/min2phase_rust.git", rev = "56ce7d4f65b0d2cc49496c43a7ddfff094b227c1" }
i2cdev = { version = "0.6.2", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
cc = "1"

# Release profile tuned for embedded (Milk-V Duo 256M, 256 MB RAM)
[profile.release]
strip = true
lto = true
opt-level = 2
