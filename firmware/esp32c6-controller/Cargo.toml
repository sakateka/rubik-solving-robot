[package]
edition      = "2024"
name         = "esp32c6-controller"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32c6-controller"
path = "./src/bin/main.rs"

[dependencies]
edge-dhcp = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
embedded-io-async = "0.7"
esp-alloc = "0.10.0"
esp-hal = { version = "~1.1.0", features = ["esp32c6", "log-04", "unstable"] }
esp-radio = { version = "0.18.0", features = ["esp32c6", "log-04", "wifi"] }
esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
  "log-04",
] }
log = "0.4.27"
picoserve = { version = "0.18.0", features = ["embassy", "json", "log"] }
rubik-link-gateway = { path = "../../crates/rubik-link-gateway" }
rubik-link-protocol = { path = "../../crates/rubik-link-protocol" }
serde = { version = "1", default-features = false, features = ["derive"] }
static_cell = "2.1"


esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6", "log-04"] }

critical-section = "1.2.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", default-features = false, features = [
  "esp32c6",
  "jtag-serial",
  "log-04",
  "critical-section",
] }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
