[package]
name = "rubik-link-protocol"
version = "0.1.0"
edition = "2021"
description = "Transport-neutral protocol and UART framing for the Rubik robot"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []

[dependencies]
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_repr = "0.1.21"
